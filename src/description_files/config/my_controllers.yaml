controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true


diff_drive_controller:
  ros__parameters:

    use_sim_time: true

    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    wheel_separation: 0.315
    wheel_radius: 0.05

    publish_rate: 50.0

    odom_frame_id: odom
    base_frame_id: base_link

    enable_odom_tf: true

    position_feedback: true

    cmd_vel_timeout: 0.5

    use_stamped_vel: false
